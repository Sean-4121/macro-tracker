<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宏量营养追踪</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宏量营养">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted);
    border-radius: 10px; cursor: pointer; font-size: 14px;
  }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; }

  .macro-row { margin-bottom: 14px; }
  .macro-row:last-child { margin-bottom: 0; }
  .macro-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .macro-name { font-weight: 600; }
  .macro-nums { color: var(--muted); font-variant-numeric: tabular-nums; }
  .macro-nums b { color: var(--text); }
  .bar { height: 8px; background: #eef0f3; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width .3s ease; }
  .status { font-size: 12px; margin-top: 4px; color: var(--muted); }
  .status.ok { color: #10b981; }
  .status.over { color: #ef4444; }

  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 15px;
  }
  .field input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .note-field { margin-top: 8px; }
  .note-field input { width: 100%; }

  .btn {
    display: block; width: 100%; margin-top: 12px; padding: 12px;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    font-size: 15px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn.danger { background: #ef4444; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  .entry { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .entry:last-child { border-bottom: none; }
  .entry .t { font-size: 13px; color: var(--muted); }
  .entry .vals { font-size: 14px; font-variant-numeric: tabular-nums; }
  .entry .del { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; padding: 4px 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  .pct { font-weight: 600; }
  .pct.full { color: #10b981; }

  .empty { color: var(--muted); text-align: center; padding: 20px 0; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>宏量营养追踪</h1>
  <p class="subtitle">记录每日碳水 · 蛋白质 · 脂肪摄入</p>

  <div class="tabs">
    <button id="tabToday" class="active">今日</button>
    <button id="tabHistory">历史</button>
    <button id="tabSettings">设置</button>
  </div>

  <!-- 今日 -->
  <section id="viewToday">
    <div class="card">
      <h2>今日进度</h2>
      <div id="todayProgress"></div>
    </div>

    <div class="card">
      <h2>记录一次摄入</h2>
      <div class="grid3">
        <div class="field">
          <label>碳水 (g)</label>
          <input id="inCarbs" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">
        </div>
        <div class="field">
          <label>蛋白质 (g)</label>
          <input id="inProtein" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">
        </div>
        <div class="field">
          <label>脂肪 (g)</label>
          <input id="inFat" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">
        </div>
      </div>
      <div class="field note-field">
        <label>备注（可选，如「早餐」「鸡胸肉」）</label>
        <input id="inNote" type="text" placeholder="可不填">
      </div>
      <button class="btn" id="btnAdd">添加记录</button>
    </div>

    <div class="card">
      <h2>今日记录</h2>
      <div id="todayEntries"></div>
    </div>
  </section>

  <!-- 历史 -->
  <section id="viewHistory" class="hidden">
    <div class="card">
      <h2>完成历程</h2>
      <div id="historyTable"></div>
    </div>
  </section>

  <!-- 设置 -->
  <section id="viewSettings" class="hidden">
    <div class="card">
      <h2>每日目标</h2>
      <div class="grid3">
        <div class="field">
          <label>碳水 (g)</label>
          <input id="setCarbs" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">
        </div>
        <div class="field">
          <label>蛋白质 (g)</label>
          <input id="setProtein" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">
        </div>
        <div class="field">
          <label>脂肪 (g)</label>
          <input id="setFat" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">
        </div>
      </div>
      <button class="btn" id="btnSave">保存目标</button>
    </div>

    <div class="card">
      <h2>数据</h2>
      <button class="btn danger" id="btnReset">清空所有数据</button>
    </div>
  </section>
</div>

<script>
const STORAGE_KEY = 'macro-tracker-v1';

const MACROS = [
  { key: 'carbs',   name: '碳水',    color: '#6366f1' },
  { key: 'protein', name: '蛋白质',  color: '#10b981' },
  { key: 'fat',     name: '脂肪',    color: '#f59e0b' },
];

let state = {
  targets: { carbs: 0, protein: 0, fat: 0 },
  dayTargets: {},   // date -> {carbs,protein,fat} 快照
  entries: []       // {id, date, time, carbs, protein, fat, note}
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  } catch (e) {}
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function dateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function timeStr(d) {
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function today() { return dateStr(new Date()); }

function getTargetsFor(date) {
  if (state.dayTargets[date]) return state.dayTargets[date];
  return state.targets;
}

function fmt(n) {
  n = Math.round(n * 10) / 10;
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function sumToday() {
  const d = today();
  const t = { carbs: 0, protein: 0, fat: 0 };
  state.entries.forEach(e => {
    if (e.date === d) {
      t.carbs += e.carbs || 0;
      t.protein += e.protein || 0;
      t.fat += e.fat || 0;
    }
  });
  return t;
}

/* ---------- 今日视图 ---------- */
function renderToday() {
  const targets = getTargetsFor(today());
  const consumed = sumToday();
  const box = document.getElementById('todayProgress');
  box.innerHTML = MACROS.map(m => {
    const c = consumed[m.key];
    const target = targets[m.key] || 0;
    const remaining = target - c;
    const pct = target > 0 ? Math.min(c / target * 100, 100) : 0;

    let status, statusCls;
    if (target <= 0) { status = '未设置目标'; statusCls = ''; }
    else if (remaining > 0) { status = `还差 ${fmt(remaining)} g`; statusCls = ''; }
    else if (remaining === 0) { status = '已达标'; statusCls = 'ok'; }
    else { status = `超出 ${fmt(-remaining)} g`; statusCls = 'over'; }

    return `
      <div class="macro-row">
        <div class="macro-head">
          <span class="macro-name" style="color:${m.color}">${m.name}</span>
          <span class="macro-nums"><b>${fmt(c)}</b> / ${target > 0 ? fmt(target) : '—'} g</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${m.color}"></div></div>
        <div class="status ${statusCls}">${status}</div>
      </div>`;
  }).join('');

  renderTodayEntries();
}

function renderTodayEntries() {
  const d = today();
  const list = state.entries.filter(e => e.date === d);
  const box = document.getElementById('todayEntries');
  if (list.length === 0) {
    box.innerHTML = '<div class="empty">今天还没有记录</div>';
    return;
  }
  box.innerHTML = list.map(e => `
    <div class="entry">
      <div>
        <div class="vals">${e.note ? `<b>${escapeHtml(e.note)}</b> · ` : ''}碳水 ${fmt(e.carbs)} · 蛋白 ${fmt(e.protein)} · 脂肪 ${fmt(e.fat)}</div>
        <div class="t">${e.time}</div>
      </div>
      <button class="del" data-id="${e.id}" title="删除">✕</button>
    </div>`).join('');
}

/* ---------- 历史视图 ---------- */
function renderHistory() {
  const box = document.getElementById('historyTable');
  const byDate = {};
  state.entries.forEach(e => {
    if (!byDate[e.date]) byDate[e.date] = { carbs: 0, protein: 0, fat: 0, count: 0 };
    byDate[e.date].carbs += e.carbs || 0;
    byDate[e.date].protein += e.protein || 0;
    byDate[e.date].fat += e.fat || 0;
    byDate[e.date].count++;
  });

  const dates = Object.keys(byDate).sort().reverse();
  if (dates.length === 0) {
    box.innerHTML = '<div class="empty">暂无历史记录</div>';
    return;
  }

  let html = `<table><thead><tr><th>日期</th><th>碳水</th><th>蛋白质</th><th>脂肪</th><th>完成度</th></tr></thead><tbody>`;
  dates.forEach(d => {
    const day = byDate[d];
    const targets = getTargetsFor(d);
    const pcts = MACROS.map(m => {
      const t = targets[m.key] || 0;
      return t > 0 ? day[m.key] / t : 0;
    });
    const hasTarget = MACROS.some(m => (targets[m.key] || 0) > 0);
    const avg = hasTarget ? pcts.reduce((a, b) => a + b, 0) / MACROS.length * 100 : null;
    const avgTxt = avg === null ? '—' : Math.round(avg) + '%';
    const full = avg !== null && avg >= 100;
    const label = d === today() ? `${d}（今天）` : d;
    html += `<tr>
      <td>${label}</td>
      <td>${fmt(day.carbs)}</td>
      <td>${fmt(day.protein)}</td>
      <td>${fmt(day.fat)}</td>
      <td class="pct ${full ? 'full' : ''}">${avgTxt}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  box.innerHTML = html;
}

/* ---------- 设置视图 ---------- */
function renderSettings() {
  document.getElementById('setCarbs').value = state.targets.carbs || '';
  document.getElementById('setProtein').value = state.targets.protein || '';
  document.getElementById('setFat').value = state.targets.fat || '';
}

function saveTargets() {
  const carbs = parseFloat(document.getElementById('setCarbs').value) || 0;
  const protein = parseFloat(document.getElementById('setProtein').value) || 0;
  const fat = parseFloat(document.getElementById('setFat').value) || 0;
  state.targets = { carbs, protein, fat };
  // 今天立即使用新目标
  state.dayTargets[today()] = { carbs, protein, fat };
  save();
  renderToday();
  alert('目标已保存');
}

/* ---------- 添加 / 删除 ---------- */
function addEntry() {
  const carbs = parseFloat(document.getElementById('inCarbs').value) || 0;
  const protein = parseFloat(document.getElementById('inProtein').value) || 0;
  const fat = parseFloat(document.getElementById('inFat').value) || 0;
  const note = document.getElementById('inNote').value.trim();

  if (carbs === 0 && protein === 0 && fat === 0) {
    alert('请至少输入一项摄入量');
    return;
  }

  const now = new Date();
  const d = today();
  // 首次记录当天时，快照当前目标作为该天目标
  if (!state.dayTargets[d]) {
    state.dayTargets[d] = Object.assign({}, state.targets);
  }
  state.entries.push({
    id: Date.now() + '' + Math.floor(Math.random() * 1000),
    date: d,
    time: timeStr(now),
    carbs, protein, fat, note
  });
  save();
  document.getElementById('inCarbs').value = '';
  document.getElementById('inProtein').value = '';
  document.getElementById('inFat').value = '';
  document.getElementById('inNote').value = '';
  renderToday();
}

function deleteEntry(id) {
  state.entries = state.entries.filter(e => e.id !== id);
  save();
  renderToday();
}

function resetAll() {
  if (!confirm('确定要清空所有数据吗？此操作不可恢复。')) return;
  state = { targets: { carbs: 0, protein: 0, fat: 0 }, dayTargets: {}, entries: [] };
  save();
  renderAll();
}

/* ---------- 标签切换 ---------- */
function switchTab(name) {
  document.getElementById('tabToday').classList.toggle('active', name === 'today');
  document.getElementById('tabHistory').classList.toggle('active', name === 'history');
  document.getElementById('tabSettings').classList.toggle('active', name === 'settings');
  document.getElementById('viewToday').classList.toggle('hidden', name !== 'today');
  document.getElementById('viewHistory').classList.toggle('hidden', name !== 'history');
  document.getElementById('viewSettings').classList.toggle('hidden', name !== 'settings');
  if (name === 'history') renderHistory();
  if (name === 'settings') renderSettings();
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function renderAll() {
  renderToday();
  renderHistory();
  renderSettings();
}

/* ---------- 事件绑定 ---------- */
document.getElementById('tabToday').addEventListener('click', () => switchTab('today'));
document.getElementById('tabHistory').addEventListener('click', () => switchTab('history'));
document.getElementById('tabSettings').addEventListener('click', () => switchTab('settings'));
document.getElementById('btnAdd').addEventListener('click', addEntry);
document.getElementById('btnSave').addEventListener('click', saveTargets);
document.getElementById('btnReset').addEventListener('click', resetAll);
document.getElementById('todayEntries').addEventListener('click', (e) => {
  const btn = e.target.closest('.del');
  if (btn) deleteEntry(btn.dataset.id);
});

load();
renderAll();

/* ---------- PWA：注册 Service Worker（离线缓存） ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
